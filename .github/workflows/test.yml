name: test

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.7", "3.8", "3.9", "3.10"]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: |
          sed -i 's/numms/nums/g' test.bash
          sed -i 's/numms/nums/g' averagetest.bash
          sed -i 's/numms/nums/g' dispersiontest.bash
          sed -i 's/numms/nums/g' standarddeviationtest.bash

          bash -xv ./test.bash
          bash -xv ./averagetest.bash
          bash -xv ./dispersiontest.bash
          bash -xv ./standarddeviationtest.bash
